[package]
name = "papk-info"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Displays the contents of a PAPK (Picodroid APK) file"

[[bin]]
name = "papk-info"
path = "src/main.rs"

[dependencies]
papk-format = { path = "../../crates/papk-format", features = ["write"] }
# `--verify` re-links every class and compares.
class-link = { path = "../../crates/class-link", features = ["build"] }
