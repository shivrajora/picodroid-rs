[package]
name = "pdb"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Picodroid Debug Bridge — push apps to a picodroid device over UART"

[[bin]]
name = "pdb"
path = "src/main.rs"

[dependencies]
serialport = "4"
compat = { path = "../../compat" }
papk-format = { path = "../../papk-format" }
pdb-protocol = { path = "../../pdb-protocol" }
