[package]
name = "picodroid-core"
edition = "2021"
version = "0.1.0"
license = "GPL-3.0-only"

# Feature convention: one feature per MCU family (family-rp today).
# The ESP32-S3 scaffold was removed 2026-07 (git history: platforms/esp/).
# A future family adds its feature here plus a platforms/<family>/ crate
# providing HAL/RTOS trait impls and one glue.rs — see
# docs/designs/shared-core-extraction.md §5 for the full checklist.
[features]
family-rp  = []
# Host simulator. Runs the *real* FreeRTOS kernel (POSIX port) in-process, so
# tasks, recursive mutexes, the tick and `Thread.start` are the device's rather
# than a host-thread model of them (docs/designs/freertos-host-sim.md).
#
# `cargo test` is the one exception, and it is not a choice: the harness runs
# cases on parallel threads with no scheduler started, so the kernel's task
# APIs dereference a current task that does not exist and the process
# segfaults. This crate's own test build therefore keeps the host-thread
# backing — see hal/sim/mod.rs.
sim        = ["dep:freertos-rust"]
# LittleFS, for families whose storage is raw NOR flash. Default OFF, which is
# the point: `hal::HalFs` stays the only contract this crate imposes, so a
# family backed by FAT or NVS implements that trait and links none of `fs/`.
# A family that opts in supplies an `fs::FsBackingStore` and registers
# `fs::LittleFsHal` (docs/designs/family-neutral-residue.md D2).
littlefs   = ["dep:littlefs-rust"]
# The FreeRTOS+TCP socket layer and link runner (hal/freertos_tcp). A family
# on FreeRTOS+TCP turns it on and registers `FreeRtosTcpNet`; a family on
# another IP stack implements HalNet itself and links none of this.
freertos-tcp = []
# Board selection — forwarded by the binary crate's board-* features so this
# crate's build.rs can resolve the same board.toml and generate the neutral
# config (JVM sizing, sensor/button tables, display dims) from it.
# Marker features only: no code gates on them, build.rs reads the env var.
board-testbench-rp2040  = []
board-testbench-rp2350  = []
board-testbench-rp2350w = []
board-pico-enviro-mon   = []
board-pico-enviro-mon-w = []
# Board capability features — activated by the binary crate's board features and
# forwarded here so picodroid-core can emit the matching rustc-cfgs.
# Each new board capability (sensor, network link kind, etc.) needs a feature
# here so the driver code in picodroid-core compiles correctly for that board.
sensor-bme688   = ["any-sensor"]
sensor-ltr559   = ["any-sensor"]
any-sensor      = []
# The board's network link kind — build_support::board_cfg::KNOWN_NETWORK_TYPES
# maps a board.toml `network_type` to one of these. Both imply has-network.
network-wifi     = ["has-network"]
network-ethernet = ["has-network"]
has-network     = []
# Diagnostics / staged-rollout features, forwarded from the binary crate so
# shared code compiles the same way the platform crate does.
handle-table-32 = []
parity-metrics  = []
parity-fbhash   = []
mem-diag        = []
# Stack-trace source positions; forwarded to pico-jvm, and read by build.rs
# (CARGO_FEATURE_LINE_NUMBERS) to embed the SDK tree that keeps
# LineNumberTable/SourceFile. See platforms/rp/Cargo.toml.
line-numbers    = ["pico-jvm/line-numbers"]

[dependencies]
pico-jvm      = { path = "../jvm" }
compat        = { path = "../compat", version = "0.1" }
# The install stream's integrity check is a PDBP concern: its hasher is seeded
# with the CMD_INSTALL byte, and the host computes the same value.
pdb-protocol  = { path = "../pdb-protocol" }
# Runtime dep since graphics/assets.rs moved here: it reads the APK's ASST
# section to build LVGL image descriptors.
papk-format   = { path = "../papk-format" }
embedded-hal  = "1.0"
defmt         = "1"
# Optional, behind `littlefs` — see that feature's note.
littlefs-rust = { version = "0.1", default-features = false, features = ["alloc"], optional = true }

# Host-only. minifb backs the simulator's display window and its touch/key
# input; libc gives the heap limiter a `getenv` that does not allocate, which
# it must not do while running inside the global allocator. Both moved here
# with the simulator, so a family crate needs neither a host GUI dependency
# nor a host libc to be simulatable.
[target.'cfg(not(target_arch = "arm"))'.dependencies]
minifb = "0.28"
libc = "0.2"
# The simulator's FreeRTOS kernel bindings. Same fork the device build uses, so
# host and device drive one set of them; its `links = "freertos"` metadata is
# also what exports DEP_FREERTOS_SHIM to build.rs.
freertos-rust = { version = "0.2.3", package = "freertos-rust-pd", optional = true }

[dev-dependencies]
# The install path's compat gate is only exercisable against a real PAPK
# manifest, so the tests build one rather than hand-rolling bytes that could
# drift from the format.
papk-format = { path = "../papk-format", features = ["write"] }
# Reads the committed shrink maps for the member-name guard tests
# (native_handler/member_names.rs); a build-dependency already, host-only.
class-shrink = { path = "../tools/class-shrink" }

[build-dependencies]
# Compiles the vendored LVGL C sources; this crate owns that build because it
# holds the code calling into them (see build.rs).
cc = "1.0"
class-shrink = { path = "../tools/class-shrink" }
papk-format = { path = "../papk-format" }
