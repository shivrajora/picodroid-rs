# Framework keep list — names that must NOT be renamed by the shrinker.
#
# Classes: `[[class]]` / `[[glob]]` below. Members (methods and fields, mapped
# by bare name since map v0.16.0): `[[member]]` only. Since v0.17.0 every name
# the runtime serves is mapped — the java/** contract members included
# (toString, equals, run, compare, hasNext, …): Rust matches them through the
# generated `m::` consts (build_support/names.rs), so an app override renames
# in lockstep with the JVM's own arms. Un-keeping a member is compat-breaking
# (compat::MEMBER_SHRINK_FLOOR); keeping one is a permanent cost.
#
# java/** classes are NOT kept either: they are shrunk under the `b/`
# namespace (tools/class-shrink/src/rename.rs) and the JVM's tables are
# generated in the same spelling (`c::`), so a --shrink image carries no
# original name at all. `Class.getName()` returns the mapped name; build
# without --shrink for readable names, or run logs through
# `class-shrink retrace`.

# The keep-annotation class itself — its internal name is how the shrinker
# recognizes `@KeepName` annotations on user classes later.
[[class]]
name = "picodroid/annotation/KeepName"

# App entry points invoked by literal from Rust (boot.rs / lifecycle.rs) on
# classes the SDK never declares — the generated `_MembersInjector` and the
# main class — so they stay verbatim, as ProGuard keeps `main`. Under
# --shrink-app (class-shrink cut-app) the injector CLASS is renamed after its
# component (`c/A` → `c/A_MembersInjector`) so lifecycle.rs's derivation
# still resolves; these two member names are what it then invokes.
[[member]]
name = "main"

[[member]]
name = "injectMembers"

# The kotlin/** stdlib shim (kotlin-shim/) rides inside Kotlin apps' PAPKs and
# is never renamed. Maps are generated from the SDK set, so this documents the
# invariant more than it enforces it (docs/designs/kotlin-roadmap-2026-08.md).
[[glob]]
pattern = "kotlin/**"
