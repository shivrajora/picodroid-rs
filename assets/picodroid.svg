<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="picodroid-title">
  <title id="picodroid-title">Picodroid</title>

  <!--
    Picodroid logo.

    Two colours only: the brand orange (#f97316) and white. The white is real
    white rather than a knockout, so the mark reads correctly on light and dark
    backgrounds alike without a separate inverted artwork.

    Everything is drawn as geometry — the wordmark included — so the logo needs
    no webfont and rasterises identically in a browser, a README and a favicon.
  -->

  <!-- Mark -->

  <!-- Body: the rounded-square console shell -->
  <rect x="250" y="192" width="526" height="456" rx="112" ry="112" fill="#f97316"/>

  <!-- Screen -->
  <rect x="322" y="254" width="378" height="264" rx="62" ry="62" fill="#fff"/>

  <!-- Eyes -->
  <circle cx="414" cy="378" r="37" fill="#f97316"/>
  <circle cx="608" cy="378" r="37" fill="#f97316"/>

  <!-- Speaker dots on the chin -->
  <circle cx="566" cy="575" r="22" fill="#fff"/>
  <circle cx="640" cy="575" r="22" fill="#fff"/>

  <!-- Wordmark -->

  <!--
    "Picodroid" in a rounded geometric sans, drawn as 30-unit round-capped
    strokes on a 130-unit cap height / 100-unit x-height with the baseline at
    y=830. Bowls are true circles, which is what gives the face its Poppins /
    Nunito flavour.

    Spacing is by constant optical area, not by constant edge gap: for every
    adjacent pair the white between the two ink profiles (measured over the
    cap-height band, with the profile depth capped at 20 units so the eye is
    not led into a counter) is held to ~4600 square units. That is what puts
    "dr" 31 units apart and "od" only 12 — a uniform edge gap makes flat-sided
    pairs look cramped and round-sided pairs look gappy. Kerning falls out of
    the same measurement: "ro" tucks the r's shoulder 7 units over the o.
  -->
  <g fill="none" stroke="#f97316" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <!-- P -->
    <path d="M108 815V700"/>
    <path d="M108 700a36 36 0 0 1 0 72"/>
    <!-- i -->
    <path d="M197 815v-85"/>
    <!-- c -->
    <path d="M310.8 757.5a35 35 0 1 0 0 45"/>
    <!-- o -->
    <circle cx="388" cy="780" r="35"/>
    <!-- d -->
    <circle cx="500" cy="780" r="35"/>
    <path d="M535 675v140"/>
    <!-- r -->
    <path d="M596 815v-85"/>
    <path d="M596 768a38 38 0 0 1 38-38"/>
    <!-- o -->
    <circle cx="706" cy="780" r="35"/>
    <!-- i -->
    <path d="M794 815v-85"/>
    <!-- d -->
    <circle cx="881" cy="780" r="35"/>
    <path d="M916 675v140"/>
  </g>

  <!-- Tittles -->
  <circle cx="197" cy="698" r="16" fill="#f97316"/>
  <circle cx="794" cy="698" r="16" fill="#f97316"/>
</svg>
