# A Kotlin app's jvmTarget (1.8) must equal its Java targetCompatibility;
# fail the build instead of silently emitting mismatched class versions.
kotlin.jvm.target.validation.mode=error
# kapt (Kotlin apps' @Inject processing, PicodroidPapkKotlinPlugin): the only
# processor is the explicit kapt(:inject:compiler) dependency, so skip the
# deprecated compile-classpath processor scan.
kapt.include.compile.classpath=false
# The examples/ tree is ~72 independent :examples:<app> projects with no
# inter-project dependencies, so `compileJava` and `assemblePapk` fan out
# cleanly. Task-output caching makes a re-run after an unrelated edit a
# near-no-op, which is what makes pre-commit's change-scoped fast tier worth
# having.
org.gradle.parallel=true
org.gradle.caching=true
