# Clippy configuration (CLAUDE.md, golden rules: firmware never panics).
#
# The leaf crates carry `#![deny(clippy::unwrap_used, clippy::expect_used,
# clippy::panic, clippy::unreachable, clippy::todo, clippy::unimplemented)]`
# (scripts/pre-commit stage_clippy_leaf lints them; scripts/panic-baseline.conf
# ratchets the crates still on their way down). Tests may unwrap, expect and
# panic: a failing test is the point of one.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
