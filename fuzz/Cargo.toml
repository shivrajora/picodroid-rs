# SPDX-License-Identifier: GPL-3.0-only
# The cargo-fuzz crate (docs/designs/fuzzing-2026-10.md). Nightly-only and
# outside the root workspace, so libfuzzer-sys never reaches a stable build.
# Each target is a three-line shim over crates/fuzz-targets, where the logic
# and the stable replay of fuzz/regress/ live. Run through scripts/fuzz.sh.
[package]
name = "picodroid-fuzz"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
fuzz-targets = { path = "../crates/fuzz-targets" }

[workspace]
members = ["."]

# The root workspace's patch for every patched crate this graph reaches,
# verbatim but for the path; scripts/fuzz.sh refuses to run when they differ.
[patch.crates-io]
embedded-tls = { path = "../third_party/embedded-tls" }

[profile.release]
debug = 1

[[bin]]
name = "papk"
path = "fuzz_targets/papk.rs"
test = false
doc = false
bench = false

