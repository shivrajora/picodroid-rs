[package]
edition = "2021"
rust-version = "1.75"
name = "rp2040-hal"
version = "0.10.2"
authors = ["The rp-rs Developers"]
description = "A Rust Embedded-HAL impl for the rp2040 microcontroller"
homepage = "https://github.com/rp-rs/rp-hal"
