[package]
name = "pd-tls"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "TLS 1.3 client pieces for picodroid: the compiled-in trust store, the multi-anchor certificate verifier, a heap-resident session over any embedded-io socket, and the handshake RNG."
readme = "README.md"

[lib]
path = "src/lib.rs"

[features]
default = ["rsa"]
# RSA chains (Let's Encrypt R-series, DigiCert, GlobalSign R-roots): the
# `rsa` crate plus its bignum, on top of the ECDSA-only client. Off leaves a
# lean ECDSA client for the size study.
rsa = ["embedded-tls/rsa"]

[dependencies]
# TLS 1.3 client, vendored under third_party/embedded-tls through the root
# [patch.crates-io] (README-PICODROID.md there lists the two local changes).
embedded-tls = { version = "0.19", default-features = false, features = ["rustpki", "p384"] }
embedded-io = { version = "0.7", default-features = false }
# The handshake RNG (rng.rs): HMAC-SHA256 over a counter, seeded from the
# platform's entropy source — the primitives embedded-tls already links.
hmac = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
rand_core = { version = "0.6", default-features = false }

[dev-dependencies]
# `tests/live.rs`: std sockets behind the embedded-io traits the session takes.
embedded-io-adapters = { version = "0.7", features = ["std"] }
