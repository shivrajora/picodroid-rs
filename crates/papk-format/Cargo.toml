# SPDX-License-Identifier: GPL-3.0-only
[package]
name = "papk-format"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "PAPK (Picodroid APK) container format: no_std zero-copy parser, alloc-gated writer. Single source of truth for the on-disk layout."

[dependencies]
compat = { path = "../compat" }
# The CLASSES section is a class-link class section: every class with its
# link table, plus the sorted class index.
class-link = { path = "../class-link" }

[dev-dependencies]
# The tests build class sections from real class files.
class-link = { path = "../class-link", features = ["build"] }

[features]
default = []
write = ["class-link/build"] # enables the alloc-based builder (and the class linker)
