# Board: TestBench RP2040 — Waveshare 2.8" Pico display (ST7789 + XPT2046) on Pico (RP2040)
mcu = "rp2040"

# Program region: 1152K. The MCU default (fs 128K + app region 1024K) left
# 896K, which the framework's link tables — the parsed record of every SDK
# class, in flash since 2026-09-28 (docs/designs/class-link-2026-09.md) —
# overflowed by ~40 KB. This is a single-app board (max_installed_apps = 1)
# and the largest example PAPK is ~125 KB, so the app region gives up 256K.
app_region_kb = 768

# RAM (256 KB): the FreeRTOS arena (rp2040.toml heap_kb = 160) carries every
# task stack and the JVM, so LVGL's own pool is trimmed to the 48 KB the
# Enviro boards run their full UI on; 64 KB (lv_conf.h's default) next to a
# 128 KB arena left the JVM ~35 KB for app data and the 2026-09-09 bench
# out of memory in gcstress, threadstress and the Kotlin stdlib suite.
lv_mem_kb = 48

# No View.onDraw(Canvas) here: Canvas, Paint, their Rust arms and the display
# list in pd-lvgl-sys/lvgl/pd_canvas.c are ~16 KB of flash (measured
# 2026-09-26), a third of what this program region has left. The build derives
# the class exclusion from this key; do not list the classes below. Apps that
# draw need a 2350-class board (docs/designs/canvas-2026-09.md).
has_canvas = false

# Networking will never be supported on this board, and framework classes are
# embedded on every board whether an app uses them or not — so the whole
# picodroid.net stack is pure flash cost here, on the tightest program region
# in the fleet. Drop all of it except NetworkInfo: the native stub
# deliberately keeps isConnected()/getIpAddress() answerable
# (native_handler/net_stub.rs) so an app written for several boards can probe
# and degrade gracefully, which needs the class to resolve. Everything else
# could only ever throw UnsupportedOperationException.
# The java.util.concurrent core set (pools, Future, atomics, latch — pure
# Java, ~17 KB of class files) is also left out: the RP2040 image sits within
# a few KB of its 896K ceiling, and Thread + Executors cover this board's
# needs. Apps that use them need a 2350-class board (examples/jucdemo).
# picodroid.json stays off too (no `has_json = true` here): the three
# classes plus the native node pool are more flash than this region can
# spare, and the build derives their exclusion from the missing key — do
# not list them below. JSON apps need a 2350-class board (examples/jsondemo).
# picodroid.protobuf is off the same way (no `has_protobuf = true`): the five
# stream classes plus the native codec; protobuf apps need a 2350-class board
# (examples/protodemo).
# picodroid.media goes below rather than being derived from a missing
# `[audio]` section, unlike picodroid.json above. Its class names have to
# exist in the committed name tables (sdk/class-names.tsv, member-names.tsv)
# for the boards that DO have a buzzer to compile against, and those tables
# are generated from one build — so the classes cannot be dropped wherever
# `[audio]` is absent without emptying the vocabulary. Here they are ~2.2 KB
# that could never make a sound, which this region cannot spare; on the
# roomier 2350 boards they stay and cost nothing that matters.
# java.time (with java.util.TimeZone and java.time.zone.ZoneRules) goes too:
# ~67 KB of class files this region cannot hold. Apps that use it need a
# 2350-class board (examples/timedemo); `verifyApiContract --board` says so.
# Fragments (picodroid.app.Fragment, FragmentManager, FragmentTransaction,
# FragmentFactory) and the pager over them (picodroid.widget.ViewPager2,
# FragmentStateAdapter) are pure Java, ~18 KB of class files this region
# cannot hold; Activity only creates its manager on the first
# getSupportFragmentManager(), so an app that composes with Activities and
# Views never resolves them. Fragment apps need a 2350-class board
# (examples/fragmentdemo, examples/pagerdemo).
# The scheduled executor (picodroid.concurrent.ScheduledExecutorService,
# ScheduledFuture, ScheduledFutureTask, MainScheduledExecutor) follows the
# executors this board already drops: ~6 KB of class files, and its API
# needs TimeUnit, which is not here either. Executors only resolves it in
# newSingleThreadScheduledExecutor(), so nothing else notices. Apps that
# schedule need a 2350-class board (examples/executordemo). SntpClient is a
# network client on a board with no network, ~1.7 KB; only
# HttpsURLConnection, dropped above, reaches for it.
framework_class_excludes = "java/time/DateTimeException;java/time/DayOfWeek;java/time/Duration;java/time/Instant;java/time/LocalDate;java/time/LocalDateTime;java/time/LocalTime;java/time/Month;java/time/Year;java/time/ZoneId;java/time/ZoneOffset;java/time/chrono/ChronoLocalDate;java/time/chrono/ChronoLocalDateTime;java/time/format/DateTimeFormatter;java/time/temporal/ChronoUnit;java/time/temporal/Temporal;java/time/temporal/TemporalAccessor;java/time/temporal/TemporalUnit;java/time/zone/ZoneRules;java/util/TimeZone;picodroid/net/HttpURLConnection;picodroid/net/HttpInputStream;picodroid/net/HttpOutputStream;picodroid/net/URL;picodroid/net/ssl/HttpsURLConnection;picodroid/net/Socket;picodroid/net/ServerSocket;picodroid/net/DatagramSocket;picodroid/net/DatagramPacket;picodroid/net/InetAddress;picodroid/concurrent/ThreadPoolExecutor;picodroid/concurrent/FutureTask;picodroid/concurrent/ExecutorService;picodroid/concurrent/Future;picodroid/concurrent/Callable;picodroid/concurrent/TimeUnit;picodroid/concurrent/AtomicInteger;picodroid/concurrent/AtomicLong;picodroid/concurrent/AtomicBoolean;picodroid/concurrent/AtomicReference;picodroid/concurrent/CountDownLatch;picodroid/net/ConnectivityManager;picodroid/net/Network;picodroid/net/NetworkCapabilities;picodroid/net/NetworkRequest;picodroid/net/wifi/WifiManager;picodroid/net/wifi/ScanResult;picodroid/net/wifi/WifiInfo;picodroid/net/wifi/WifiConfiguration;picodroid/net/wifi/SupplicantState;picodroid/media/ToneGenerator;picodroid/media/AudioManager;picodroid/app/Fragment;picodroid/app/FragmentManager;picodroid/app/FragmentTransaction;picodroid/app/FragmentFactory;picodroid/widget/ViewPager2;picodroid/widget/FragmentStateAdapter;picodroid/concurrent/ScheduledExecutorService;picodroid/concurrent/ScheduledFuture;picodroid/concurrent/ScheduledFutureTask;picodroid/concurrent/MainScheduledExecutor;picodroid/concurrent/ScheduledThreadPoolExecutor;picodroid/concurrent/ScheduledThreadPoolExecutor$Task;picodroid/net/SntpClient"

# Background pool: two workers with 8 KB stacks where the default is four with
# 4 KB. The same 16 KB of the arena, and a worker can then write a file:
# LittleFS under a Java frame needs more than 4 KB, and
# SharedPreferences.apply() hands its write to this pool (prefs_demo overflowed
# a 4 KB worker stack on this board, 2026-10-01).
# No button on this board, so the framework draws the BACK/HOME control in a corner
# of the panel (tap = BACK, hold = HOME) and a touch wakes the display: the TOUCH
# input profile's escape for a board that cannot grow a system button
# (docs/designs/app-portability-2026-10.md K3). A new touch board declares a
# [[button]] instead.
soft_nav = true

[background_pool]
stack_bytes = 8192
threads = 2

[display]
driver = "st7789"
spi_id = 1
spi_freq = 62500000
pin_dc = 8
pin_cs = 9
pin_rst = 15
pin_bl = 13
width = 320
height = 240
# 320x240 over a 2.8" diagonal. Physical pixels per inch: DisplayMetrics.xdpi and the
# touch-target floor read it; LVGL's theme does not (LV_DPI_DEF is pinned to 160
# on every board, docs/designs/app-portability-2026-10.md D3).
dpi = 143
madctl = 0x60
band_height = 20
scroll_limit = 30

[touch]
driver = "xpt2046"
spi_freq = 2000000
pin_cs = 16
pin_irq = 17
pin_miso = 12
cal_x_min = 1970
cal_x_max = 185
cal_y_min = 110
cal_y_max = 1950
swap_xy = true
