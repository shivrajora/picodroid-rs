# Board: TestBench RP2040 — Waveshare 2.8" Pico display (ST7789 + XPT2046) on Pico (RP2040)
mcu = "rp2040"

# Networking will never be supported on this board, and framework classes are
# embedded on every board whether an app uses them or not — so the whole
# picodroid.net stack is pure flash cost here, on the tightest program region
# in the fleet. Drop all of it except NetworkInfo: the native stub
# deliberately keeps isConnected()/getIpAddress() answerable
# (native_handler/net_stub.rs) so an app written for several boards can probe
# and degrade gracefully, which needs the class to resolve. Everything else
# could only ever throw UnsupportedOperationException.
# The java.util.concurrent core set (pools, Future, atomics, latch — pure
# Java, ~17 KB of class files) is also left out: the RP2040 image sits within
# a few KB of its 896K ceiling, and Thread + Executors cover this board's
# needs. Apps that use them need a 2350-class board (examples/jucdemo).
# picodroid.json stays off too (no `has_json = true` here): the three
# classes plus the native node pool are more flash than this region can
# spare, and the build derives their exclusion from the missing key — do
# not list them below. JSON apps need a 2350-class board (examples/jsondemo).
framework_class_excludes = "picodroid/net/HttpURLConnection;picodroid/net/HttpInputStream;picodroid/net/HttpOutputStream;picodroid/net/URL;picodroid/net/Socket;picodroid/net/ServerSocket;picodroid/net/DatagramSocket;picodroid/net/DatagramPacket;picodroid/net/InetAddress;picodroid/concurrent/ThreadPoolExecutor;picodroid/concurrent/FutureTask;picodroid/concurrent/ExecutorService;picodroid/concurrent/Future;picodroid/concurrent/Callable;picodroid/concurrent/TimeUnit;picodroid/concurrent/AtomicInteger;picodroid/concurrent/AtomicLong;picodroid/concurrent/AtomicBoolean;picodroid/concurrent/AtomicReference;picodroid/concurrent/CountDownLatch"

[display]
driver = "st7789"
spi_id = 1
spi_freq = 62500000
pin_dc = 8
pin_cs = 9
pin_rst = 15
pin_bl = 13
width = 320
height = 240
madctl = 0x60
band_height = 20
scroll_limit = 30

[touch]
driver = "xpt2046"
spi_freq = 2000000
pin_cs = 16
pin_irq = 17
pin_miso = 12
cal_x_min = 1970
cal_x_max = 185
cal_y_min = 110
cal_y_max = 1950
swap_xy = true
