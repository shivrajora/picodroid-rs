# Board: TestBench (WiFi) — Waveshare 2.8" Pico display (ST7789 + XPT2046)
# on a Raspberry Pi Pico 2 W (RP2350 + CYW43439 WiFi)
mcu = "rp2350"
# 2026-09-26: the hot sets beyond the interpreter loop execute from SRAM
# (docs/designs/sram-hotpath-2026-09.md; the chip feature `hot-in-ram`,
# which build.rs requires to agree with this key). Taken out of the arena
# like `jvm_loop_ram_kb`. 2026-09-28: 48 → 60 with the longer lists and the
# class-link accessors (docs/designs/ram-headroom-2026-09.md §6).
hot_ram_kb = 60

# Multi-app (docs/designs/multi-app-2026-09.md D1/D2): the app region holds
# up to eight installed apps as self-describing runs, LittleFS grows to
# 512 KB for per-app storage, and the program image takes 2560 KB.
# FLASH 2560K @0x10000000 | FS_FLASH 512K @0x10280000 | PAPK_FLASH 1024K @0x10300000
# 2026-09-29: the app region gave up 256 KB (1536 → 1280 KB; eight apps the
# size of claudeusage still fit) because the debug image — no name shrink,
# line numbers on, no LTO — of a W board (radio firmware + net + TLS) was
# 77 KB over the 2048 KB region once the framework's class link tables
# moved into flash (docs/designs/class-link-2026-09.md). The non-W RP2350
# boards keep 2048 KB: no radio, 600 KB of headroom.
# 2026-10-11: another 256 KB (1280 → 1024 KB; eight claudeusage-sized apps,
# 109 KB each, still fit): the debug image had reached 2,350 KB of 2,304 KB
# and the October bug-scan rounds (+13 KB over 51 fixes) put CI's
# pico_display2_w link 4 KB over. Headroom is now ~258 KB.
# 2026-10-14: line numbers are off by default on every board (71,544 B of
# this debug image; PICODROID_LINE_NUMBERS=1 brings them back), after the
# October rounds (dedup, hash dispatch, the Utf8 pool) had already taken it
# from 2,358,688 to 2,199,976 B. Debug image 2,128,432 B, headroom ~481 KB
# (docs/designs/flash-budget-2026-09.md, 2026-10-14 amendment).
max_installed_apps = 8
app_region_kb = 1024
fs_kb = 512
# picodroid.json (JSONObject/JSONArray, native node pool). Off by default;
# on here because the 2816K program region has the room. See
# framework_class_excludes in the porting guide for what "off" drops.
has_json = true
has_protobuf = true
has_network = true
network_type = "cyw43"
# HTTPS (docs/designs/tls-2026-09.md): pd-tls behind the platform's `tls`
# feature, which the board feature forwards; build.rs checks they agree.
has_tls = true

# LVGL's pool at the 48 KB the Enviro boards and testbench_rp2040 run their
# full UI on, not lv_conf.h's 64 KB default. The core-0 main stack is what
# .data + .bss leave of RAM, and this board's radio statics (cyw43 state,
# network buffers, DNS cache) on top of the 408 KB arena left it 3,072 B in
# the release image once the build read the linked figure instead of size(1)
# (2026-09-17; the same day's touch-kit fault). 48 KB links 19,456 B, over
# the 8,192 B floor the linker script asserts (build_support/flash_layout.rs).
lv_mem_kb = 48

# No button on this board, so the framework draws the BACK/HOME control in a corner
# of the panel (tap = BACK, hold = HOME) and a touch wakes the display: the TOUCH
# input profile's escape for a board that cannot grow a system button
# (docs/designs/app-portability-2026-10.md K3). A new touch board declares a
# [[button]] instead.
soft_nav = true

[display]
driver = "st7789"
spi_id = 1
spi_freq = 75000000
pin_dc = 8
pin_cs = 9
pin_rst = 15
pin_bl = 13
width = 320
height = 240
# 320x240 over a 2.8" diagonal. Physical pixels per inch: DisplayMetrics.xdpi and the
# touch-target floor read it; LVGL's theme does not (LV_DPI_DEF is pinned to 160
# on every board, docs/designs/app-portability-2026-10.md D3).
dpi = 143
madctl = 0x60
band_height = 20
scroll_limit = 30

[touch]
driver = "xpt2046"
spi_freq = 2000000
pin_cs = 16
pin_irq = 17
pin_miso = 12
cal_x_min = 3940
cal_x_max = 370
cal_y_min = 220
cal_y_max = 3900
swap_xy = true

# A pool worker that runs a native from a couple of Java calls deep needs more
# than the 4 KB default: the settings app's Storage screen, which counts every
# package's data on a worker (a few directory listings through the fs task),
# measured 4,088 B deep — a 4 KB stack overflowed. 6 KB leaves 33 % headroom,
# the same size the Enviro W runs its NTP/weather job on; the heap cost is
# +2 KB x 4 workers = 8 KB, out of the FreeRTOS arena, not the image.
[background_pool]
stack_bytes = 6144
