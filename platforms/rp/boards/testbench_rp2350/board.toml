# Board: TestBench — Waveshare 2.8" Pico display (ST7789 + XPT2046)
mcu = "rp2350"
# 2026-09-26: the hot sets beyond the interpreter loop execute from SRAM
# (docs/designs/sram-hotpath-2026-09.md; the chip feature `hot-in-ram`,
# which build.rs requires to agree with this key). Taken out of the arena
# like `jvm_loop_ram_kb`. 2026-09-28: 48 → 60 with the longer lists and the
# class-link accessors (docs/designs/ram-headroom-2026-09.md §6).
hot_ram_kb = 60

# Multi-app (docs/designs/multi-app-2026-09.md D1/D2): the app region holds
# up to eight installed apps as self-describing runs, LittleFS grows to
# 512 KB for per-app storage, and the program image keeps 2048 KB.
# FLASH 2048K @0x10000000 | FS_FLASH 512K @0x10200000 | PAPK_FLASH 1536K @0x10280000
max_installed_apps = 8
app_region_kb = 1536
fs_kb = 512
# picodroid.json (JSONObject/JSONArray, native node pool). Off by default;
# on here because the 2816K program region has the room. See
# framework_class_excludes in the porting guide for what "off" drops.
has_json = true
has_protobuf = true

# LVGL's pool at the 48 KB the Enviro boards and testbench_rp2040 run their
# full UI on, not lv_conf.h's 64 KB default. The core-0 main stack is what
# .data + .bss leave of RAM; with the 64 KB pool this board linked 9,216 B
# in release and exactly the 8,192 B floor in debug (2026-09-17, once the
# build read the linked figure instead of size(1)), so the next static byte
# would have failed the link. 48 KB buys 16 KB of margin over the floor the
# linker script asserts (build_support/flash_layout.rs).
lv_mem_kb = 48

# No button on this board, so the framework draws the BACK/HOME control in a corner
# of the panel (tap = BACK, hold = HOME) and a touch wakes the display: the TOUCH
# input profile's escape for a board that cannot grow a system button
# (docs/designs/app-portability-2026-10.md K3). A new touch board declares a
# [[button]] instead.
soft_nav = true

[display]
driver = "st7789"
spi_id = 1
spi_freq = 62500000
pin_dc = 8
pin_cs = 9
pin_rst = 15
pin_bl = 13
width = 320
height = 240
# 320x240 over a 2.8" diagonal. Physical pixels per inch: DisplayMetrics.xdpi and the
# touch-target floor read it; LVGL's theme does not (LV_DPI_DEF is pinned to 160
# on every board, docs/designs/app-portability-2026-10.md D3).
dpi = 143
madctl = 0x60
band_height = 20
scroll_limit = 30

[touch]
driver = "xpt2046"
spi_freq = 2000000
pin_cs = 16
pin_irq = 17
pin_miso = 12
cal_x_min = 1970
cal_x_max = 185
cal_y_min = 110
cal_y_max = 1950
swap_xy = true

# A pool worker that runs a native from a couple of Java calls deep needs more
# than the 4 KB default: the settings app's Storage screen, which counts every
# package's data on a worker (a few directory listings through the fs task),
# measured 4,088 B deep — a 4 KB stack overflowed. 6 KB leaves 33 % headroom,
# the same size the Enviro W runs its NTP/weather job on; the heap cost is
# +2 KB x 4 workers = 8 KB, out of the FreeRTOS arena, not the image.
[background_pool]
stack_bytes = 6144
