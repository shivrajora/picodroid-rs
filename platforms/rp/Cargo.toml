[package]
edition = "2021"
name = "picodroid"
version = "0.30.0"
license = "GPL-3.0-only"

[features]
# Bare `cargo build` uses this default. To target a different board (or sim),
# use the per-board cargo aliases — see docs/cargo-aliases.md.
default = ["board-testbench-rp2350"]
# Deterministic sim<->device execution counters + per-flush band CRCs for
# the parity harness (docs/parity-audit.md P1/G1). Off in normal builds.
parity-metrics = ["pico-jvm/parity-metrics", "picodroid-core/parity-metrics"]
parity-fbhash = ["picodroid-core/parity-fbhash"]
# Opt-in memory diagnostics (docs/memory-diagnostics.md): periodic [memmon]
# heap monitor, growth sentinel, churn counters, offensive heap checks.
# Zero-cost when off (code is compiled out). Sim: ./scripts/sim.sh --mem-diag.
# Firmware: PICODROID_EXTRA_FEATURES=mem-diag (RP2350-first; RP2040 is a
# manual, flash-budget-checked opt-in).
mem-diag = ["pico-jvm/mem-diag", "picodroid-core/mem-diag"]
# Opt-in scheduling diagnostics (docs/scheduling-diagnostics.md): the
# kernel's trace and tick hooks feed a monitor that reports one `schedmon:`
# line per second (idle share, switches) and flags HOG / STARVE / POLL /
# BUSYDELAY / SPIN. Zero-cost when off: the hooks are not compiled into the
# kernel and none of the monitor exists. Sim: ./scripts/sim.sh --sched-diag.
# Firmware: PICODROID_EXTRA_FEATURES=sched-diag (any board; RP2040 is a
# manual, flash-budget-checked opt-in like mem-diag).
sched-diag = ["picodroid-core/sched-diag"]
# Source positions in uncaught-exception traces (`(File.java:39)` instead of
# `(pc=9)`). scripts/sim.sh always enables it; scripts/flash.sh enables it
# for debug-profile firmware and drops it for --release (~15 KB of flash for
# the SDK LineNumberTable/SourceFile on every board). Never a default.
line-numbers = ["pico-jvm/line-numbers", "picodroid-core/line-numbers"]
# defmt-rtt blocks the logging task whenever a probe host has set the RTT
# channel to block-if-full (probe-rs does) and the 1 KB ring is full, so a
# slow host stalls whichever task logs -- the cyw43 task and the IP task
# included -- and every HIL timing figure taken with a probe attached has
# that stall folded in. Without a probe the writer is already non-blocking.
# This feature makes it non-blocking (lossy under sustained overload) with a
# probe too; keep it off for HIL rows, whose expected patterns need every
# line (docs/scheduling-audit-2026-09.md, F6).
rtt-lossy = ["defmt-rtt/disable-blocking-mode"]
# Board selection (user-facing — pick exactly one for embedded builds).
# Each forwards a marker feature of the same name to picodroid-core so its
# build.rs resolves the same board.toml and generates the neutral config from
# it (docs/designs/shared-core-extraction.md §3.D). A board that declares a
# sensor/network capability must also forward the matching capability feature;
# board_cfg::assert_forwarded_features_match fails the build otherwise.
board-testbench-rp2040 = ["chip-rp2040", "picodroid-core/board-testbench-rp2040"]
board-testbench-rp2350 = ["chip-rp2350", "picodroid-core/board-testbench-rp2350"]
board-pico-enviro-mon = ["chip-rp2350", "picodroid-core/board-pico-enviro-mon", "picodroid-core/sensor-bme688", "picodroid-core/sensor-ltr559"]
board-pico-enviro-mon-w = ["chip-rp2350", "picodroid-core/board-pico-enviro-mon-w", "picodroid-core/sensor-bme688", "picodroid-core/sensor-ltr559", "picodroid-core/network-wifi"]
board-pico-display2-w = ["chip-rp2350", "picodroid-core/board-pico-display2-w", "picodroid-core/network-wifi"]
board-testbench-rp2350w = ["chip-rp2350", "picodroid-core/board-testbench-rp2350w", "picodroid-core/network-wifi"]
# RP2350B (chip-rp2350: rp235x-hal covers both variants; the 16 MB flash is
# described by mcus/rp/rp2350b.toml, which board.toml names).
board-pico-touch-kit = ["chip-rp2350", "picodroid-core/board-pico-touch-kit", "picodroid-core/network-wifi"]
# MCU selection (internal — activated by board features)
chip-rp2040 = ["dep:rp-pico", "family-rp"]
# The RP2350 runs the interpreter loop from RAM (mcus/rp/rp2350*.toml
# `jvm_loop_ram_kb` funds it); the RP2040's 264 KB has no room for it.
chip-rp2350 = ["dep:rp235x-hal", "family-rp", "pico-jvm/loop-in-ram"]
# MCU family grouping (internal — forwarded to picodroid-core so both crates
# see the same family feature without requiring duplicate cfg flags).
family-rp = ["picodroid-core/family-rp"]
# Capability cfgs (has_display / has_touch / has_network / network_<type> /
# network_link_<kind>) are emitted
# by build.rs from board.toml — not Cargo features. See build.rs::emit_network_config.
# Escape hatch for the generational handle table (audit P1-9), which every
# board now compiles: brings back the zero-cost-cast nativeHandle path, whose
# handles dangle after a widget delete (parity-audit HAL-05). The table became
# the default on 2026-09-15 once the qa_ui rows and the picoenvmon nav + PDB
# reload soak passed with it on; this feature keeps the cast buildable for one
# release, then goes away with the cast. 64-bit builds ignore it — the sim has
# always run the table.
legacy-handle-cast = ["picodroid-core/legacy-handle-cast"]
# Prove the PSRAM at boot: a full write-and-verify sweep of the part through
# both XIP aliases, with write and read bandwidth, logged by hal/rp/psram.rs.
# Seconds of boot time, so never a default: flash with
# PICODROID_EXTRA_FEATURES=psram-sweep. Nothing on a board without psram_kb.
psram-sweep = []
# Simulator mode (no hardware). Runs the real FreeRTOS kernel on the host —
# see picodroid-core's `sim` feature and docs/designs/freertos-host-sim.md.
sim = ["picodroid-core/sim", "dep:freertos-rust"]

[dependencies]
# No `compat` / `pdb-protocol` here: this crate names neither. Both still
# reach the binary through picodroid-core, which does use them.
picodroid-core = { path = "../../crates/picodroid-core", features = ["littlefs", "freertos-tcp"] }
pico-jvm = { path = "../../crates/jvm" }
papk-format = { path = "../../crates/papk-format" }
embedded-hal = { version = "1.0.0" }
defmt = "1"
# Still direct: `fs/storage.rs` implements `littlefs_rust::Storage` for the
# flash region. Everything else LittleFS moved to picodroid-core's `littlefs`
# feature, which this crate turns on just above.
littlefs-rust = { version = "0.1", default-features = false, features = ["alloc"] }

# RP-family (Cortex-M) embedded deps.
[target.'cfg(target_arch = "arm")'.dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
freertos-rust = { version = "0.2.3", package = "freertos-rust-pd" }
rp-pico = { version = "0.9", optional = true }
rp235x-hal = { version = "0.4", optional = true, features = ["rt", "critical-section-impl"] }
pio = "0.3"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }

# This crate's own `cargo test` runs on the host and routes `hal::mod chip`
# to the simulator HAL, which now lives in picodroid-core behind its `sim`
# feature. A dependency is never compiled with the dependent's `cfg(test)`,
# so the feature has to be asked for explicitly here — otherwise
# `picodroid_core::hal::sim` simply does not exist in the test build.
[dev-dependencies]
picodroid-core = { path = "../../crates/picodroid-core", features = ["sim"] }
# Source-scan helpers behind the text-based guard tests.
picodroid-test-support = { path = "../../crates/test_support" }

# Host-side FreeRTOS, for the simulator. Same fork, same version and same
# package as the ARM declaration above, so host and device drive one set of
# bindings; the kernel C itself is compiled by picodroid-core's build.rs,
# which owns the simulator.
[target.'cfg(not(target_arch = "arm"))'.dependencies]
freertos-rust = { version = "0.2.3", package = "freertos-rust-pd", optional = true }

# No other host-only dependencies. minifb and libc both moved to picodroid-core
# with the simulator: a family crate should need neither a host GUI nor a host
# libc to be simulatable. The `#[global_allocator]` attribute stays in this
# crate (it is only legal in a binary), but it forwards to core's instance.

[build-dependencies]
# Board-derived codegen, flash layout, the FreeRTOS kernel and network C
# builds, and PAPK embedding.
picodroid-build-support = { path = "../../crates/build_support", features = ["freertos-device"] }
