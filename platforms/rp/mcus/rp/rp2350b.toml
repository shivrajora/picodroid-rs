# MCU: RP2350B (Cortex-M33, dual-core) — the 80-pin variant of the RP2350.
#
# Same die and same core as rp2350.toml: same clock, same 520 KB of SRAM, same
# FreeRTOS port, same bootrom contract. Three things differ, and two of them
# are expressed here.
#
#  * Flash. The RP2350B carriers picodroid targets ship 16 MB rather than 4, and
#    `flash_kb` is read only from this file — `build_support/flash_layout.rs`
#    takes it from the MCU and never from board.toml — so a 16 MB board cannot
#    be described without a descriptor of its own.
#  * PSRAM. The module carries 8 MB on the QMI's second chip select (the
#    `psram_*` keys below); the A-variant boards have none.
#  * Pins. 48 GPIO instead of 30, with the ADC inputs on GP40-GP47 rather than
#    GP26-GP29. Nothing here encodes that: the HAL addresses pads by number and
#    every pin picodroid drives on this variant today is below GP30, except the
#    PSRAM chip select — which is only ever a pad-function select, never a SIO
#    output, so it needs none of the bank-1 SIO registers hal/rp/gpio.rs,
#    input_pin.rs and spi/mod.rs lack. A board that drives GP32 or above as a
#    plain GPIO still needs those written.
#
# The Cargo feature stays `chip-rp2350`: rp235x-hal covers both variants, and
# the MCU descriptor name and the chip feature are resolved independently
# (config.rs::resolve_active_mcu vs the board feature's forwarding list).
family = "rp"
target = "thumbv8m.main-none-eabihf"
clock_hz = 150000000
ram_kb = 520
flash_kb = 16384
# The module's 8 MB APS6404L PSRAM on the QMI's second chip select, reached
# through XIP window 1 (RP2350 datasheet §4.4, §12.14). Module properties
# rather than die properties, like flash_kb, and kept here for the same
# reason: flash_layout.rs renders the PSRAM region from the MCU descriptor,
# and the Pico Plus 2 W is the only RP2350B carrier picodroid targets. The
# chip select is GP47 on this module. hal/rp/psram.rs brings the part up at
# boot and derives the window's timing from clock_hz: 150 MHz gives a QMI
# divisor of 2, a 75 MHz bus inside the part's 133 MHz rating, and an 8 µs
# tCEM burst limit of 18 x 64 clocks. What lives there is board policy —
# the LVGL pool is the one tenant offered so far (board.toml `lv_mem_in_psram`,
# measured and left off on pico_touch_kit); the JVM arena, the operand stacks
# and the draw band stay in SRAM regardless, because PSRAM is reached over the
# same QSPI bus and XIP cache as the flash
# (docs/designs/psram-lvgl-fluid-scroll-2026-09.md).
psram_kb = 8192
psram_origin = 0x11000000
psram_cs_pin = 47
core_count = 2
# FreeRTOS heap arena (configTOTAL_HEAP_SIZE) — single source of truth.
# Injected into the FreeRTOS C build AND the sim's default heap cap
# (build_support/freertos.rs / platforms/rp/build.rs::emit_heap_config).
#
# 344 KB, not the A variant's 408: this descriptor funds the touch board's
# draw bands (board.toml `band_height` and `draw_buffers`: two 60-row
# buffers, 76,800 B of .bss against the default's 12,800). The core-0 main
# stack is whatever .data + .bss leave of
# the 520 KB and the arena is most of .bss, so the 64,000 B the buffer grew
# came out of here — 65,536 B, which leaves the build's main-stack headroom
# at 13,536 B over the 8,192 floor scripts/lib.sh enforces, a little more
# than before. The margin was measured rather than reasoned about: picoclock
# peaks at ~276 KB of arena with the radio up, the launcher and settings
# sweep no deeper, so 352 KB leaves ~76 KB (22 %), and joining WiFi costs
# under 1 KB of it (docs/designs/band-height-120-2026-09.md §5). The two
# RP2350 descriptors no longer build identically; that was a convenience,
# not a contract. The other way to fund the band is the module's PSRAM —
# board.toml `lv_mem_in_psram` moves the 64 KB LVGL pool there and this can
# go back to 408 — at a measured 10 % of the frame, which is why that board
# leaves it off.
heap_kb = 344
size_tool = "arm-none-eabi-size"
# Every C object built for this MCU (LVGL, the FreeRTOS kernel and shim, the
# network stack and the WiFi driver) compiles at -Os instead of following
# cargo's OPT_LEVEL — see rp2350.toml for the measurement this came from.
# Kept here even though this variant's program region is not flash-starved:
# the two RP2350 descriptors should build their C identically, or a size
# comparison between them measures the compiler rather than the code.
c_opt_level = "s"
freertos_port = "ThirdParty/Community-Supported-Ports/GCC/RP2350_ARM_NTZ/non_secure"
pico_shim = "src/hal/rp/port/pico_shim_rp2350.c"

# FreeRTOS C build knobs consumed by build_support/freertos.rs. Keys are
# semicolon-separated lists; see freertos.rs for the schema.
freertos_port_extra_includes = "src/hal/rp/port"
freertos_c_defines = "LIB_PICO_MULTICORE=1;LIB_PICO_SYNC=0;LIB_PICO_TIME=0;configUSE_DYNAMIC_EXCEPTION_HANDLERS=0"
# CMSIS vector slot -> portasm symbol aliases injected into the linker.
freertos_vector_aliases = "SVCall=isr_svcall;PendSV=isr_pendsv;SysTick=isr_systick"
# Section to place .init_array in (RP-specific quirk: FLASH keeps BSS clean
# for UF2 converters). Leave unset on platforms that don't need this.
init_array_segment = "FLASH"

# Flash layout (build_support/flash_layout.rs): 16 MB, top-down from the end —
# the app region, then LittleFS, the program image in front of them. These
# defaults are the single-app geometry, matching rp2350.toml's role; a board
# overrides fs_kb, app_region_kb and max_installed_apps for multi-app
# (docs/designs/multi-app-2026-09.md D2), as pico_touch_kit does.
flash_origin = 0x10000000
ram_origin = 0x20000000
fs_kb = 256
app_region_kb = 1024
max_installed_apps = 1
