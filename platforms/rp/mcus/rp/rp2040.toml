# MCU: RP2040 (Cortex-M0+, dual-core)
family = "rp"
target = "thumbv6m-none-eabi"
clock_hz = 125000000
ram_kb = 256
flash_kb = 2048
core_count = 2
# FreeRTOS heap arena (configTOTAL_HEAP_SIZE) — single source of truth.
# Injected into the FreeRTOS C build AND the sim's default heap cap
# (build_support/freertos.rs / platforms/rp/build.rs::emit_heap_config).
heap_kb = 160
size_tool = "arm-none-eabi-size"
# Every C object built for this MCU (LVGL, the FreeRTOS kernel and shim)
# compiles at -Os instead of following cargo's OPT_LEVEL. The 896 KB program
# region is the fleet's tightest, and the C is where -Os pays most for the
# least risk: LVGL and the kernel shrink by about a third, Rust and the JVM
# are untouched (docs/designs/flash-budget-2026-09.md §6.1). Render
# throughput is the cost. Read by build_support/config.rs::apply_c_opt_level.
c_opt_level = "s"
freertos_port = "ThirdParty/GCC/RP2040"
pico_shim = "src/hal/rp/port/pico_shim_rp2040.c"

# FreeRTOS C build knobs consumed by build_support/freertos.rs. Keys are
# semicolon-separated lists; see freertos.rs for the schema.
freertos_port_extra_includes = "src/hal/rp/port;../../third_party/FreeRTOS-Kernel/portable/ThirdParty/GCC/RP2040/include"
freertos_c_defines = "LIB_PICO_MULTICORE=1;LIB_PICO_SYNC=0;LIB_PICO_TIME=0;configUSE_DYNAMIC_EXCEPTION_HANDLERS=0"
# CMSIS vector slot -> portasm symbol aliases injected into the linker.
freertos_vector_aliases = "SVCall=isr_svcall;PendSV=isr_pendsv;SysTick=isr_systick"
# Section to place .init_array in (RP-specific quirk: FLASH keeps BSS clean
# for UF2 converters). Leave unset on platforms that don't need this.
init_array_segment = "FLASH"

# Flash layout (build_support/flash_layout.rs): 2 MB, top-down from the end —
# a 1 MB app region, then 128 KB of LittleFS, the program image in front of
# them behind the 256-byte boot2. A board may override fs_kb, app_region_kb
# and max_installed_apps; this MCU has no room for more than one app.
flash_origin = 0x10000000
ram_origin = 0x20000000
boot2_bytes = 0x100
fs_kb = 128
app_region_kb = 1024
max_installed_apps = 1
