# MCU: RP2350 (Cortex-M33, dual-core)
family = "rp"
target = "thumbv8m.main-none-eabihf"
clock_hz = 150000000
ram_kb = 520
flash_kb = 4096
core_count = 2
# FreeRTOS heap arena (configTOTAL_HEAP_SIZE) — single source of truth.
# Injected into the FreeRTOS C build AND the sim's default heap cap
# (build_support/freertos.rs / platforms/rp/build.rs::emit_heap_config).
#
# 2026-09-04: 416 → 408 KB. The core-0 main stack (boot, then every core-0
# interrupt for the life of the firmware) is whatever .data + .bss leave of
# the 520 KB; the arena is most of .bss. The network boards' extra statics
# (cyw43 state, buffer descriptors, DNS cache) had squeezed it to 4.4 KB and
# the debug-profile image faulted at boot before its first log line. 408 KB
# keeps at least 12 KB on every RP2350 board; scripts/lib.sh fails a build
# whose headroom drops below MAIN_STACK_FLOOR_BYTES. picoenvmon still fits:
# the simulator cap that models a 408 KB device heap (376 KB) runs it clean.
heap_kb = 408
size_tool = "arm-none-eabi-size"
# Every C object built for this MCU (LVGL, the FreeRTOS kernel and shim, the
# network stack and the WiFi driver) compiles at -Os instead of following
# cargo's OPT_LEVEL. The program region is 2 MB, but the image grew 93 KB in
# the first week of September 2026 (JSON, multi-app) and the C is the cheapest
# third of it to give back: LVGL and the kernel shrink by about a third, Rust
# and the JVM are untouched (docs/designs/flash-budget-2026-09.md §6.1).
# Render throughput is the cost. Read by build_support/config.rs::apply_c_opt_level.
c_opt_level = "s"
freertos_port = "ThirdParty/Community-Supported-Ports/GCC/RP2350_ARM_NTZ/non_secure"
pico_shim = "src/hal/rp/port/pico_shim_rp2350.c"

# FreeRTOS C build knobs consumed by build_support/freertos.rs. Keys are
# semicolon-separated lists; see freertos.rs for the schema.
freertos_port_extra_includes = "src/hal/rp/port"
freertos_c_defines = "LIB_PICO_MULTICORE=1;LIB_PICO_SYNC=0;LIB_PICO_TIME=0;configUSE_DYNAMIC_EXCEPTION_HANDLERS=0"
# CMSIS vector slot -> portasm symbol aliases injected into the linker.
freertos_vector_aliases = "SVCall=isr_svcall;PendSV=isr_pendsv;SysTick=isr_systick"
# Section to place .init_array in (RP-specific quirk: FLASH keeps BSS clean
# for UF2 converters). Leave unset on platforms that don't need this.
init_array_segment = "FLASH"

# Flash layout (build_support/flash_layout.rs): 4 MB, top-down from the end —
# the app region, then LittleFS, the program image in front of them. These
# defaults are the single-app geometry; the rp2350 boards override fs_kb,
# app_region_kb and max_installed_apps for multi-app
# (docs/designs/multi-app-2026-09.md D2).
flash_origin = 0x10000000
ram_origin = 0x20000000
fs_kb = 256
app_region_kb = 1024
max_installed_apps = 1
