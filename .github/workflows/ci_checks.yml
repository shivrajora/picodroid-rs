  #       run: python3 scripts/bench-report.py --ratchet
  examples:
    name: Compile All Example APKs
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Every example, both shrink modes — an SDK signature change that breaks
      # any app (or a shrink-map gap) fails here instead of shipping silently.
      - name: Assemble all PAPKs (no-shrink)
        run: ./gradlew assemblePapk --console=plain
      - name: Assemble all PAPKs (shrink)
        run: PICODROID_SHRINK=1 ./gradlew assemblePapk --console=plain
      # Every example through the device-bound debug-attribute strip — an ASM
      # rewrite of every class (docs/designs/flash-string-budget-2026-08.md §4).
      - name: Assemble all PAPKs (strip-debug)
        run: ./gradlew assemblePapk -Ppicodroid.stripDebug=true --console=plain
      # The @Inject annotation processor's golden-output + validation tests
      # (docs/designs/inject-annotations-2026-08.md).
      - name: Test the @Inject annotation processor
        run: ./gradlew :inject:compiler:test --console=plain
      # Every kotlin/** reference the Kotlin fixture apps make resolves in
      # kotlin-shim (docs/designs/kotlin-roadmap-2026-08.md Session 5). The
      # java/** contract is enforced per app by verifyApiContract, which
      # assemblePapk above runs (android-parity roadmap E3).
      - name: Kotlin shim contract
        run: ./gradlew :kotlin-shim:contractCheck --console=plain
  sim-smoke:
    name: Sim Smoke Tests (${{ matrix.shard }})
    timeout-minutes: 45
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Four shards of eight lanes each (an app is two lanes, one per shrink
        # mode; picoenvmon is four -- both enviro boards). A lane is ~1.5 min,
        # nearly all of it relinking the sim around the app's APK, so serially
        # this job was over an hour. Add an app to the shortest shard.
        include:
          - shard: boot
            apps: helloworld classlit picoenvmon
          - shard: lang
            apps: langsuite langsuite_kt langsuite_kt_stdlib injectdemo_kt
          - shard: memory
            apps: gcstress heapstress clinitdemo tracedemo
          - shard: framework
            apps: callbacktest prefs_demo jsondemo resdemo
    env:
      # Abort loudly on any use-after-delete handle lookup (off by default;
      # see platforms/rp/.../lvgl/handle_table.rs).
      PICODROID_HANDLE_SANITIZER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install JDK
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends default-jdk-headless libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Headless end-to-end runs of the self-checking suites, both shrink
      # modes (sim-run default). Full matrix stays on the nightly cron; this
      # job closes the push -> 3 AM detection window for the JVM, GC-stress,
      # stdlib (langsuite), widget-callback dispatch, <clinit>, prefs/storage
      # and heap-pressure paths, and (resdemo) the resource compiler, the
      # generated R and the layout inflater. picoenvmon rides the enviro-board
      # smoke lanes inside sim-run.sh (parity-audit LVG-01/BRD-01) so the
      # shipping board's LVGL config is CI-simulated. The Kotlin twins hellokt,
      # gcstress_kt and picoenvmon_kt are nightly-only: the Kotlin langsuites
      # and injectdemo_kt carry the Kotlin path here.
      - name: Run sim smoke subset
        run: |
          for app in ${{ matrix.apps }}; do
            bash scripts/sim-run.sh --app "$app" --no-email
          done
  formatting:
    name: Formatting
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          target: thumbv6m-none-eabi
      - run: cargo fmt -- --check
  java-formatting:
    name: Java + Kotlin Formatting
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check Java formatting
        run: bash scripts/format_java.sh check
      - name: Check Kotlin formatting
        run: bash scripts/format_kotlin.sh check
