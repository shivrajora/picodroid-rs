name: CI Checks

# Docs-only changes skip this workflow: nothing here compiles or reads
# markdown, docs/ or website/. Their checks (markdown lint, the docs-site
# link validator, the source guards) live in ci_light.yml, which always runs.
on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'website/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'website/**'

# A newer push to the same branch supersedes the run in flight. head_ref puts
# a PR's push and pull_request events in one group, so a PR branch is built
# once, not twice.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  building:
    name: Building
    timeout-minutes: 45
    strategy:
      matrix:
        # Stable only. The reference build on nightly Rust runs weekly, in
        # rust_nightly.yml.
        os:
          - ubuntu-latest
          - macOS-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install ARM toolchain and JDK (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi default-jdk-headless libudev-dev
      - name: Install ARM toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install --cask gcc-arm-embedded || true
          VERSION=$(ls /Applications/ArmGNUToolchain | head -1)
          echo "/Applications/ArmGNUToolchain/$VERSION/arm-none-eabi/bin" >> $GITHUB_PATH
      - uses: actions/setup-java@v4
        if: runner.os == 'macOS'
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi,thumbv8m.main-none-eabihf
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-stable
      # No-ops when the cached ~/.cargo/bin already holds the binary.
      - run: cargo install flip-link
      # Build via scripts/build.sh so device firmware images pick up the
      # debug-profile flash-gate (debug-assertions/overflow-checks off, ~40 KB)
      # that keeps the RP2040 image under its 896K FLASH ceiling. build.sh
      # builds the helloworld APK itself before linking the firmware.
      # TestBench RP2040
      - run: bash scripts/build.sh --board testbench_rp2040 --app helloworld
      - run: bash scripts/build.sh --board testbench_rp2040 --app helloworld --release
      # TestBench RP2350
      - run: bash scripts/build.sh --board testbench_rp2350 --app helloworld
      - run: bash scripts/build.sh --board testbench_rp2350 --app helloworld --release
      # Unconditional shrinking's contract (docs/designs/unconditional-shrink-2026-09.md):
      # a --shrink --shrink-app image spells no original Java class, descriptor
      # or served member name, nor the app's own package. Same check as the
      # local `./scripts/pre-commit --full` shrink_image stage.
      - run: bash scripts/build.sh --board testbench_rp2350 --app helloworld --release --shrink --shrink-app
      - run: bash scripts/check-shrunk-image.sh target/thumbv8m.main-none-eabihf/release/picodroid helloworld/
  testing:
    name: Testing
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install ARM toolchain and JDK
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi default-jdk-headless libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: thumbv6m-none-eabi
      - uses: Swatinem/rust-cache@v2
      # test.sh runs gradle to build the framework-embedding APK. Cache the
      # Gradle home so we don't cold-fetch every dependency from Maven Central
      # on each run — a cold fetch is what makes this lane flake on transient
      # Maven Central 403s. restore-keys keeps deps warm even on a key miss.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - run: bash scripts/test.sh
  linting:
    name: Linting
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install ARM toolchain and JDK
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi default-jdk-headless libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: thumbv6m-none-eabi,thumbv8m.main-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - name: Check hil-tests.conf against the source tree
        run: bash scripts/check-hil-conf.sh
      - name: Build helloworld APK
        run: bash scripts/build-apk.sh --app helloworld
      # TestBench RP2040
      - run: PICODROID_APK_PATH=$(pwd)/build/apks/helloworld.papk cargo clippy -p picodroid --target thumbv6m-none-eabi --no-default-features --features board-testbench-rp2040 -- --deny=warnings
      # TestBench RP2350
      - run: PICODROID_APK_PATH=$(pwd)/build/apks/helloworld.papk cargo clippy -p picodroid --target thumbv8m.main-none-eabihf --no-default-features --features board-testbench-rp2350 -- --deny=warnings
      # TestBench RP2350W — only automated compile of the cyw43/network path
      - run: PICODROID_APK_PATH=$(pwd)/build/apks/helloworld.papk cargo clippy -p picodroid --target thumbv8m.main-none-eabihf --no-default-features --features board-testbench-rp2350w -- --deny=warnings
      # Pico Enviro Mon — only automated ARM compile of the sensor/has_buttons path
      - run: PICODROID_APK_PATH=$(pwd)/build/apks/helloworld.papk cargo clippy -p picodroid --target thumbv8m.main-none-eabihf --no-default-features --features board-pico-enviro-mon -- --deny=warnings
      # Pico Touch Kit — the only automated compile of the ST7796, the GT911 and
      # the I2C-touch path, and the only board on the rp2350b MCU descriptor
      - run: PICODROID_APK_PATH=$(pwd)/build/apks/helloworld.papk cargo clippy -p picodroid --target thumbv8m.main-none-eabihf --no-default-features --features board-pico-touch-kit -- --deny=warnings
      # Pico Enviro Mon W — the only board whose board.toml [jvm] block exports
      # anything (gc_alloc_threshold), so the only lint of that config path.
      # WiFi credentials are option_env!, so none are needed here.
      - run: PICODROID_APK_PATH=$(pwd)/build/apks/helloworld.papk cargo clippy -p picodroid --target thumbv8m.main-none-eabihf --no-default-features --features board-pico-enviro-mon-w -- --deny=warnings
      # Simulator (host target)
      - run: PICODROID_APK_PATH=$(pwd)/build/apks/helloworld.papk cargo clippy -p picodroid --target "$(rustc -vV | awk '/^host:/ { print $2 }')" --no-default-features --features sim,board-testbench-rp2350,line-numbers -- --deny=warnings
      # Host tools (previously unlinted anywhere; a real bug hid in papk-info)
      - run: cargo clippy -p pdb -p papk-pack -p papk-info -p class-shrink --all-targets --target "$(rustc -vV | awk '/^host:/ { print $2 }')" -- --deny=warnings
  # DISABLED 2026-08-29. The job works -- it links (flip-link) and pins its
  # toolchain -- but it cannot pass while Cargo.lock is gitignored: CI
  # re-resolves every dependency on each run, so the firmware moves 3-4 KB
  # against a baseline generated locally, with nothing in the tree changing.
  # Gating on something no commit controls is worse than not gating.
  #
  # To re-enable: commit Cargo.lock, re-baseline (the recipe is in
  # bench/parity/ratchet.toml's header), uncomment below, and confirm CI's
  # numbers match. Until then the ratchet runs where the comparison is
  # like-for-like: the 3 AM sim-run.sh nightly (its `size-ratchet` lane, on
  # the bench machine's own lockfile) and `./scripts/pre-commit --full`
  # before a release cut.
  # size-ratchet:
  #   name: Binary-size ratchet
  #   runs-on: ubuntu-latest
  #   steps:
