  #         submodules: recursive
  #     - name: Install ARM toolchain and JDK
  #       run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi default-jdk-headless libudev-dev
  #     # Pinned, unlike every other job: the baseline in bench/parity/ratchet.toml
  #     # is generated by the pre-commit hook on a developer's machine, and a
  #     # different rustc reads as a size change that no commit caused -- 1.98.0
  #     # builds this tree 4,044 B (rp2040) / 3,424 B (rp2350) larger than 1.95.0,
  #     # which would swamp the deltas the ratchet exists to catch. Holding the
  #     # compiler fixed is what makes the metric measure *this codebase*. Bump
  #     # this and the baseline together, in one commit with a "size:" trailer.
  #     # `building` still compiles both boards on latest stable, so a real
  #     # RP2040 flash-ceiling overflow is caught there.
