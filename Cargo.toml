[workspace]
members = [
    "crates/build_support",
    "crates/compat",
    "crates/heap4",
    "crates/http-head",
    "crates/jvm",
    "crates/papk-format",
    "crates/pd-drivers",
    "crates/pd-install",
    "crates/pd-json",
    "crates/pd-lvgl-sys",
    "crates/pd-rtos",
    "crates/pdb-protocol",
    "crates/picodroid-core",
    "crates/test_support",
    "platforms/rp",
    "tools/class-shrink",
    "tools/papk-info",
    "tools/papk-pack",
    "tools/pdb",
]
resolver = "2"

# Local fork of littlefs-rust-core v0.1.0 with `lfs_alignup` patched to use
# wrapping arithmetic — upstream panics on u32 overflow in debug builds.
# Local fork of littlefs-rust v0.1.0 (the safe API over the core) with the
# per-open 4 KB file cache reserved fallibly: on the RP2040, `vec![0u8; 4096]`
# in File::open aborted the firmware once qa_store had filled the heap, where
# an IOException / OutOfMemoryError was due (qa-2026-09-13-followups.md §3).
[patch.crates-io]
littlefs-rust-core = { path = "third_party/littlefs-rust-core" }
littlefs-rust = { path = "third_party/littlefs-rust" }
# Local fork of rp2040-hal v0.10.2 whose float-to-int intrinsics truncate:
# upstream maps `__aeabi_f2iz` & co. to the bootrom's float_to_int family,
# which rounds toward -inf, so every `as i32` of a negative fraction in
# this tree — Rust and LVGL's C alike — floored on the RP2040 and truncated
# everywhere else (qa-2026-09-13-followups.md §4). platforms/rp/src/main.rs
# checks the fix at boot.
rp2040-hal = { path = "third_party/rp2040-hal" }

# Both device profiles are opt-level 3, on purpose. Rust at "s" was priced on
# the RP2350 bench on 2026-09-08: -167 KB of .text for +29 % on the JVM
# `benchmark` interpreter sections, three times the 10 % budget, so it stays
# at 3 (docs/designs/flash-budget-2026-09.md §6.1). The size lever that did
# land is on the C side: `c_opt_level` in platforms/rp/mcus/rp/<mcu>.toml
# compiles LVGL, the kernel and the network stack at -Os without frame
# pointers, independent of these profiles. scripts/build-lib.sh::build_firmware
# layers the per-profile `--config` overrides (debug-assertions,
# overflow-checks, the rp2040 LTO rule) on top; the simulator and `cargo
# test` see the stock profiles.

# cargo build/run
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true

# cargo build/run --release
[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
overflow-checks = false

# do not optimize proc-macro crates = faster builds from scratch

[profile.dev.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

[profile.release.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

# cargo test
[profile.test]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true

# cargo test --release
[profile.bench]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
