# Crate layers; scripts/check-layers.py (check-source-guards.sh --layers).
#
# One line per workspace member: `<manifest dir> <layer>`. A crate may depend
# only on crates in a strictly lower numbered layer. Two special layers:
#   host  build-time and host-side tooling. May depend on host crates and on
#         L0..L3; anyone may name a host crate as a build- or dev-dependency.
#   test  test helpers and fuzz harnesses. May depend on anything; may be
#         named only as a dev-dependency (or by another test crate).
# A new crate must be registered here, or the guard fails. The same table is
# the workspace map in CLAUDE.md; keep the two together.
crates/class-link L0
crates/compat L0
crates/heap4 L0
crates/http-head L0
crates/pd-drivers L0
crates/pd-json L0
crates/pd-lvgl-sys L0
crates/pd-rtos L0
crates/pd-tls L0
crates/pdb-protocol L0
crates/papk-format L1
crates/jvm L1
crates/pd-codec L2
crates/pd-install L2
crates/pd-protobuf L2
crates/pd-pdb L3
crates/picodroid-core L4
platforms/rp L5
crates/build_support host
tools/class-shrink host
tools/papk-info host
tools/papk-pack host
tools/pdb host
crates/test_support test
crates/fuzz-targets test
