# HTTPS (docs/designs/tls-2026-09.md): the local TLS listener (the test CA,
# port 8443), its three ports that must be refused (an expired leaf, a chain
# under no known root, a certificate for another name), then public hosts
# whose chains end at an ECDSA and an RSA root. The public legs need the
# internet and are not asserted. In the sim the wall clock comes from the
# host (examples/https_get/test.env); on the bench the app syncs it with SNTP.
