# picodroid.os.Bundle + saved instance state (T3.1): typed get/put and the
# mismatch-gives-default rule, Intent.putExtras/getExtras, then a for-result
# Activity that calls recreate(). Its two instances must trace onPause →
# onStop → onSaveInstanceState → onDestroy, then onCreate(saved) → onStart →
# onRestoreInstanceState → onResume, with the Intent and the request code
# carried over. onCreate(Bundle), onStart, onPause, onStop and onDestroy (and
# the launcher's onActivityResult and onRestart) are declared on a base class
# the leaf does not override, which a by-name lookup on the leaf would miss
# (T3.1-F).
