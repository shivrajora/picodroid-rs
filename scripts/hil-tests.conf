helloworld|pdb|120|Uninstalled helloworld;Device is back;free: largest|uninstall
helloworld|pdb|600|no room;Refusing to install|install-reject-noroom
helloworld|pdb|900|Install complete;hilfill_e;free: largest|install-compact
