# The package directory over pdb (docs/designs/multi-app-2026-09.md M1):
# multi-app firmware only — SKIPped when the greeting reports single-app.
# `list` pins the table; `uninstall` erases the known-good helloworld and
# lists an empty directory; `noroom` fills the directory with repacked
# helloworlds and expects STATUS_NO_ROOM for one more, with nothing erased;
# `compact` installs four ~300 KB fixtures, uninstalls two, and installs a
# ~500 KB one that only fits after the device compacts the region.
