# Hardware-in-the-loop test definitions.
# Format: app|category|timeout_secs|expected_pattern1;expected_pattern2;...
#
# Categories:
#   term  — terminates after onCreate; killed once patterns match (timeout = fail)
#   loop  — runs forever; runs for full timeout, then patterns are checked
#   hw    — needs specific peripheral wiring; skipped unless --include-hw
#   pdb   — runs a PDB command against an already-running device; skipped unless
#           CDC port found or when --skip-pdb is set
#   sim   — like term, but sim-run only; skipped by hil-run (the HIL board
#           lacks what the test needs, e.g. a network stack). Optional 5th
#           column: board override for the sim build (default
#           testbench_rp2350). An examples/<app>/test.ctrl, if present, is
#           fed to the sim's control channel while the row runs
#           (sim-run.sh::drive_test_ctrl: `wait <regex>`, `sleep <s>`, or a
#           verb such as `net down` or `input keyevent 23`). A net row whose
#           app ships a test.ctrl runs in the sim only: hil-run SKIPs it, the
#           control channel being the simulator's.
#   net   — like term, but the app talks to servers on the test host: a TCP
#           echo on port 7000, an HTTP server on port 8000 and a TLS listener
#           on port 8443 (the runners start and stop all three, see
#           net-lib.sh::start_net_listeners; the build trusts the listener's
#           test CA through PICODROID_TLS_EXTRA_CA). 5th column
#           is required: the board, which must have has_network = true.
#           hil-run builds the row with that board's firmware, bakes in the
#           WiFi credentials from the gitignored .wifi-creds.env and the
#           host's LAN IP; it SKIPs the row with a reason when the creds file
#           is missing or the row's MCU is not the one on the probe. sim-run
#           runs the row against 127.0.0.1.
#   skip  — always skipped
#
# Timeouts are budgets for the RP2350; on an rp2040 slot hil-run doubles the
# term/loop/hw timeout (the chip runs the rows at about half the speed).
#
# term/loop/hw rows may carry an optional 5th column: a comma list of board
# names and/or MCU names (rp2040, rp2350, rp2350b) the row needs. hil-run runs
# the row on a bench slot only when the slot's board, or that board's MCU, is
# listed; otherwise it SKIPs with the reason. Rows without it run on every
# board. sim-run ignores this column for these rows (it only reads the 5th
# column of sim and net rows), so a filter never changes the sim matrix.
#
# The match is an exact string compare, with no family grouping: a row that
# names `rp2350` does NOT select an `rp2350b` slot, so a row meaning "any
# RP2350" has to say `rp2350,rp2350b`. The rows below that gate on chip size or
# speed all do. Getting this wrong is quiet -- the row SKIPs rather than fails.
#
# PDB tests use a 5th column: app|pdb|timeout|patterns|pdb_command
# Valid pdb_command values: ping, sysmon, install, install-stress,
#   install-reject-host, install-reject-device, install-reject-future,
#   install-reject-truncated, and on multi-app firmware (SKIPped when the
#   greeting says single-app): list, uninstall, install-reject-noroom,
#   install-compact, launch, launch-soak, settings-uninstall
#
helloworld|term|30|HelloWorld[]:] hi Hello, World! bye 42 test 123
helloworld|pdb|15|picodroid/2\.[0-9]+.*max PAPK|ping
helloworld|pdb|15|Uptime:;Free heap:|sysmon
